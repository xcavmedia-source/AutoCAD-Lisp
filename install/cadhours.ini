; ============================================================
;  CAD Hours Tracker - settings
;
;  Copy this file next to the LISP files (inside the bundle's
;  Contents folder) and edit it.  Everything has a built-in default,
;  so you only need the lines you actually want to change.
;
;  Look-up order:
;     1. the file named by the CADHOURS_CONFIG environment variable
;     2. <install folder>\cadhours.ini          <- normally this one
;     3. %APPDATA%\CADHours\cadhours.ini
;     4. the built-in defaults
;
;  Type CHCONFIG in AutoCAD to see what is actually in force.
; ============================================================


; ---- speed ---------------------------------------------------------
;
; There is nothing to configure here, but it is worth knowing how this
; works, because it affects where you edit things.
;
; Every open drawing needs the tracker loaded into it - AutoCAD gives
; each drawing its own LISP namespace, and there is no way round that.
; Reading the code off the share every time would mean about 100 kB
; over the network per drawing opened, so instead the .lsp files are
; mirrored into
;     %LOCALAPPDATA%\CADHours\modules
; and loaded from there.  The share stays the master: the timestamps of
; the server copies are checked on every drawing (a few cheap stat
; calls) and the mirror is refreshed only when they change.
;
; So: to update the tracker, replace the .lsp files on the share as
; before.  Each PC picks the change up on its next drawing and says
; "local copy updated" once.  Nothing to clear by hand.
;
; THIS file and managers.txt are always read from the share, so a
; settings change still takes effect on the next drawing everywhere.
;
; Reporting and dashboard code is not loaded until somebody actually
; runs a report, which keeps it out of every drawing entirely.
;
; CHCONFIG shows where the code was loaded from and how long start-up
; took, in milliseconds.


; ---- where the data goes -------------------------------------------
;
; A plain folder on a file server.  Everyone needs read + write on it.
; Nothing else has to be installed there - the tracker creates the
; sub-folders itself.
;
; Paths here are PLAIN Windows paths - do NOT double the backslashes.
; This is a settings file, not LISP source, so "F:\0000-Drafting" is
; read exactly as written.  (Only the path inside acaddoc.lsp needs
; forward slashes or doubled backslashes.)
;
; Exactly one LogRoot line must be active.  Comment the other out with
; a leading semicolon - the last active line wins, so a stray second
; one will silently override the first.

LogRoot            = F:\0000-Drafting\22-CADHoursData
; LogRoot          = %LOCALAPPDATA%\CADHours\data      ; local, for testing only

; Used automatically when LogRoot cannot be reached (laptop off the
; network, VPN down).  Rows written here are pushed up to LogRoot the
; next time a drawing is opened with the share available.
LocalSpool         = %LOCALAPPDATA%\CADHours\spool


; ---- the idle rule ---------------------------------------------------
;
; IdleSeconds        how long a gap in activity has to be before the
;                    clock is treated as paused.
; IdleCreditSeconds  how much of that gap is still billed.  Leaving it
;                    equal to IdleSeconds means "keep billing until
;                    five minutes of silence have passed, then stop",
;                    which is what most people mean by a five minute
;                    idle timeout.  Set it to 0 to bill nothing after
;                    the last thing the user actually did.

IdleSeconds        = 300
IdleCreditSeconds  = 300

; How often the in-progress session is written to disk.  This is what
; caps the loss if AutoCAD is killed or the PC drops.
HeartbeatSeconds   = 60

; Sessions with less billed time than this are not recorded, so that
; opening a drawing just to look at it does not clutter the database.
MinSessionSeconds  = 10


; ---- the job number prompt --------------------------------------------

; Show the pop-up as soon as a drawing opens.
PromptOnOpen       = 1

; Whether a never-saved drawing gets the pop-up too.
;
; Closing your last drawing can leave AutoCAD sitting on a fresh empty
; Drawing1, and being asked which job that belongs to feels like the
; pop-up appearing for no reason.  Set this to 0 and a drawing that has
; never been saved is tracked quietly instead, with the question waiting
; until the user actually starts working in it.
PromptOnUnsaved    = 0

; Keep asking until a job number is given.  Time is still tracked in
; the meantime and banked under UNASSIGNED, so nothing is ever lost.
RequireJobNumber   = 1

; Seconds between re-asks when the user dismissed the pop-up.
RepromptSeconds    = 120

; AutoCAD wildcard pattern the job number has to match.
;   #          one digit
;   @          one letter
;   *          any run of characters
;   [A-Z]      one character from a set
;   ,          separates alternative patterns
;
;   P#####     P then five digits            e.g. P10432   <- in use here
;   P####,P#####   five-digit or legacy four-digit
;   P#####*    allows a revision suffix      e.g. P10432A
;   *          accept anything (turns validation and JobFromPath off)
;
; Matching ignores case, so p10432 is accepted and stored as typed.
JobPattern         = P#####
JobPatternHint     = P followed by five digits, e.g. P10432

; Offer the job number found in the drawing's folder path.  With
; JobPattern set, "P:\Projects\P10432 Smith House\CAD\A-101.dwg"
; suggests P10432 on its own, and the user just presses Enter.
;
; The job number has to be a whole token: it may be separated by a
; space, dash, underscore, dot or bracket, so P10432-Smith, P10432_Smith
; and "Smith Residence (P10432)" all work - but P104321 is left alone
; rather than being mistaken for P10432.
;
; Ignored while JobPattern is "*".
JobFromPath        = 1

; Used when nothing else can be worked out.  Leave empty to force a
; conscious choice.
;
; Note this is only ever offered in the pop-up, never applied silently.
; A job number is attached to a session without asking ONLY when it came
; from the drawing itself - what this user last booked against that exact
; file, a number stored inside it, or one recognised in its folder path.
; A template, a new Drawing1 or a scratch file therefore records as
; UNASSIGNED rather than inheriting whatever job was open beforehand,
; because a wrong number in a timesheet is harder to find than a missing
; one.  Saving such a drawing into a job folder adopts that job
; automatically.
DefaultJob         =

; ---- the project manager drop-down ------------------------------------

; The list of names offered in the drop-down lives in managers.txt,
; next to this file.  One name per line; lines starting with ; or # are
; ignored.  It is re-read every time the pop-up opens, so adding or
; removing a manager takes effect on the next drawing - nobody has to
; restart AutoCAD.
;
; Set this only if you want to keep the list somewhere else, for example
; in the data folder so it can be edited without touching the read-only
; program folder.
ManagerFile        =
; ManagerFile      = F:\0000-Drafting\22-CADHoursData\managers.txt

; Insist on a manager being chosen before the pop-up will close.  Off by
; default, so a drawing is never blocked because the list is out of date.
; The manager used for a job is remembered and offered again next time.
RequireManager     = 0


; ---- who can see other people's hours -----------------------------------

; Some reports cover everyone's hours rather than just the hours of whoever
; ran the command.  That is a management number, not a personal one, so it
; is worth being deliberate about who can pull it.
;
; Leave this blank (the default) and nothing is restricted - every command
; behaves exactly as it always has.  List Windows user names here - comma or
; semicolon separated, case does not matter - and for everyone NOT on the
; list these four commands narrow to their own hours:
;
;   CHDASH       the browser dashboard    - refused, with a pointer to the
;   CHDASHALL    the same, whole history  -   personal commands below
;   CHFIND       session search           - no longer offers "* for all
;                                            users"; fixed to the caller
;   CHJOBHOURS   totals for one job       - shows that user's own share of
;                                            the job, not the team's
;
; CHTODAY, CHWEEK and CHREPORT are personal reports already and are never
; restricted, so a drafter keeps everything they need for their own time.
;
; This file lives in the read-only program folder, so a user cannot add
; themselves to the list any more than they can edit the tracker itself -
; the same enforcement the rest of the install already relies on.  It is a
; tidiness boundary, not a secret: the underlying CSV files are only as
; private as the permissions on LogRoot make them.
AdminUsers         =
; AdminUsers       = DAVID.CRUZ, KWEBB


; ---- the pop-up itself --------------------------------------------------

; 1 = ask with the pop-up dialog.  0 = ask on the command line instead.
;
; Set this to 0 if the dialog misbehaves on a machine - the command-line
; prompt asks for exactly the same four things, so nothing is lost and
; time keeps being tracked while you sort it out.  The command line is
; also used automatically whenever the dialog cannot be displayed.
UseDialog          = 1


; ---- the notes panel ----------------------------------------------------

; How many rows of the notes panel are visible at once.
;
; The note itself has no length limit - the panel scrolls, so a long
; note does not make the dialog any taller.  This only sets how much of
; it you can see without scrolling.  Range 2 to 12.
;
; Lower it to 2 if the dialog is too tall for the screen, since a DCL
; dialog does not scroll and the buttons at the bottom would be out of
; reach.  Raise it if you have the room and people write a lot.
;
; How notes get typed: a line at a time in the Add box (Enter appends
; it), or all at once in Notepad via the button - that is a real text
; editor, so it is the one to use for anything long.  Clicking a line in
; the panel lifts it back into the Add box to be corrected.
NoteLines          = 4


; Also store the job number inside the drawing, so it follows the file
; between users.  Off by default: writing to the drawing marks it as
; modified, and the user gets asked to save a file they only opened.
RememberJobInDwg   = 0


; ---- what counts as activity --------------------------------------------

; Grip edits and Properties-palette changes raise no command, so the
; database reactor is what notices them.  Leave this on.
TrackObjectEdits   = 1

; Only every Nth object event does any work.  Raise it if you see any
; slowdown on very large edits; the command handlers still catch
; anything the stride skips.
ObjectEventStride  = 20

; Off by default.  Some system variables change on their own, which
; would keep the clock running while nobody is at the desk.
TrackSysVarChanges = 0


; ---- housekeeping ----------------------------------------------------------

; Write a detailed per-session event log as well as the session row.
;
; Off by default.  It is only an audit trail - the session row is the
; real record - and switching it on costs a folder creation and a file
; write across the share every time a drawing is opened, which is time
; the user spends waiting.  Turn it on while proving the tool out, then
; turn it back off.
WriteEventLog      = 0

; Re-file sessions left behind by a crash, push up rows that were
; spooled locally, clear locks left by a crash, and bring older session
; files up to the current column set.
AutoRecover        = 1

; How often that housekeeping actually runs, in minutes, per machine.
;
; All of it walks the share, so doing it every time a drawing opens is
; the single most noticeable delay on a busy morning - and pointless,
; since nothing it fixes is urgent.  Once an hour settles everything.
; 0 means every drawing open, which is only useful for testing.
SweepMinutes       = 60

; How long an in-progress session has to be untouched before it counts
; as abandoned.  Make this longer than the longest realistic lunch.
StaleLiveHours     = 8

; How many recent job numbers the pop-up offers.
MruCount           = 12

; 1 = print internal detail to the command line.
Debug              = 0
