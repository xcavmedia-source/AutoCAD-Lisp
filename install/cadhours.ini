; ============================================================
;  CAD Hours Tracker - settings
;
;  Copy this file next to the LISP files (inside the bundle's
;  Contents folder) and edit it.  Everything has a built-in default,
;  so you only need the lines you actually want to change.
;
;  Look-up order:
;     1. the file named by the CADHOURS_CONFIG environment variable
;     2. <install folder>\cadhours.ini          <- normally this one
;     3. %APPDATA%\CADHours\cadhours.ini
;     4. the built-in defaults
;
;  Type CHCONFIG in AutoCAD to see what is actually in force.
; ============================================================


; ---- where the data goes -------------------------------------------
;
; A plain folder on a file server.  Everyone needs read + write on it.
; Nothing else has to be installed there - the tracker creates the
; sub-folders itself.
;
; Leave LogRoot pointing at a local folder while you are testing.

LogRoot            = %LOCALAPPDATA%\CADHours\data
; LogRoot          = \\fileserver\Company\CADHours

; Used automatically when LogRoot cannot be reached (laptop off the
; network, VPN down).  Rows written here are pushed up to LogRoot the
; next time a drawing is opened with the share available.
LocalSpool         = %LOCALAPPDATA%\CADHours\spool


; ---- the idle rule ---------------------------------------------------
;
; IdleSeconds        how long a gap in activity has to be before the
;                    clock is treated as paused.
; IdleCreditSeconds  how much of that gap is still billed.  Leaving it
;                    equal to IdleSeconds means "keep billing until
;                    five minutes of silence have passed, then stop",
;                    which is what most people mean by a five minute
;                    idle timeout.  Set it to 0 to bill nothing after
;                    the last thing the user actually did.

IdleSeconds        = 300
IdleCreditSeconds  = 300

; How often the in-progress session is written to disk.  This is what
; caps the loss if AutoCAD is killed or the PC drops.
HeartbeatSeconds   = 60

; Sessions with less billed time than this are not recorded, so that
; opening a drawing just to look at it does not clutter the database.
MinSessionSeconds  = 10


; ---- the job number prompt --------------------------------------------

; Show the pop-up as soon as a drawing opens.
PromptOnOpen       = 1

; Keep asking until a job number is given.  Time is still tracked in
; the meantime and banked under UNASSIGNED, so nothing is ever lost.
RequireJobNumber   = 1

; Seconds between re-asks when the user dismissed the pop-up.
RepromptSeconds    = 120

; AutoCAD wildcard pattern the job number has to match.
;   *          anything
;   ##-####    two digits, a dash, four digits    e.g. 24-1057
;   [A-Z]####  a letter then four digits          e.g. J1057
JobPattern         = *
JobPatternHint     =

; Offer the job number found in the drawing's folder path.  With
; JobPattern set, "P:\Projects\24-1057 Smith House\CAD\A-101.dwg"
; suggests 24-1057 on its own.  Ignored while JobPattern is "*".
JobFromPath        = 1

; Used when nothing else can be worked out.  Leave empty to force a
; conscious choice.
DefaultJob         =

; Also store the job number inside the drawing, so it follows the file
; between users.  Off by default: writing to the drawing marks it as
; modified, and the user gets asked to save a file they only opened.
RememberJobInDwg   = 0


; ---- what counts as activity --------------------------------------------

; Grip edits and Properties-palette changes raise no command, so the
; database reactor is what notices them.  Leave this on.
TrackObjectEdits   = 1

; Only every Nth object event does any work.  Raise it if you see any
; slowdown on very large edits; the command handlers still catch
; anything the stride skips.
ObjectEventStride  = 20

; Off by default.  Some system variables change on their own, which
; would keep the clock running while nobody is at the desk.
TrackSysVarChanges = 0


; ---- housekeeping ----------------------------------------------------------

; Write a detailed per-session event log as well as the session row.
; Useful while you are proving the tool out; costs one small file per
; drawing session.
WriteEventLog      = 1

; Re-file sessions left behind by a crash when a drawing opens.
AutoRecover        = 1

; How long an in-progress session has to be untouched before it counts
; as abandoned.  Make this longer than the longest realistic lunch.
StaleLiveHours     = 8

; How many recent job numbers the pop-up offers.
MruCount           = 12

; 1 = print internal detail to the command line.
Debug              = 0
