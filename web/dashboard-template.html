<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD Hours</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #16181d;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #1f6feb;
    --accent-soft: #dbe8fd;
    --warn: #b45309;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f25;
      --ink: #e6e8ec;
      --muted: #98a1ae;
      --line: #2b3038;
      --accent: #5b9bff;
      --accent-soft: #23334d;
      --warn: #e0a44a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--ink);
    font: 14px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header { margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .cards {
    display: grid; gap: 12px; margin: 18px 0;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 16px; min-width: 0;
  }
  .card .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
  .card .v {
    font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px;
    display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 18px;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  input, select, button {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #q { min-width: 260px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); border-color: var(--line); font-weight: 500; }
  h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  thead th { cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
  td.n, th.n { text-align: right; }
  tbody tr:hover { background: var(--accent-soft); }
  tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: none; }
  .bar { height: 6px; border-radius: 3px; background: var(--accent); min-width: 2px; display: block; }
  .barcell { width: 22%; min-width: 90px; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .pill.run { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .rowline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  @media print {
    body { padding: 0; background: #fff; }
    .controls, button { display: none; }
    .panel, .card { border-color: #ccc; break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <h1>CAD Hours</h1>
  <div class="sub" id="meta"></div>
</header>

<div class="cards" id="cards"></div>

<div class="panel">
  <div class="controls">
    <div class="fld"><label for="q">Search</label>
      <input id="q" placeholder="user, job, drawing, note&hellip;"></div>
    <div class="fld"><label for="fuser">User</label><select id="fuser"></select></div>
    <div class="fld"><label for="fjob">Job</label><select id="fjob"></select></div>
    <div class="fld"><label for="from">From</label><input id="from" type="date"></div>
    <div class="fld"><label for="to">To</label><input id="to" type="date"></div>
    <div class="fld"><label for="grp">Group by</label>
      <select id="grp">
        <option value="job">Job</option>
        <option value="user">User</option>
        <option value="date">Day</option>
        <option value="week">Week</option>
        <option value="month">Month</option>
        <option value="dwg">Drawing</option>
        <option value="task">Task / phase</option>
        <option value="job|user">Job + User</option>
        <option value="user|date">User + Day</option>
      </select></div>
    <button class="ghost" id="reset" type="button">Reset</button>
  </div>
</div>

<div class="panel">
  <div class="rowline">
    <h2 id="pivotTitle">Hours by job</h2>
    <button class="ghost" id="dlPivot" type="button">Download CSV</button>
  </div>
  <div class="scroll"><table id="pivot">
    <thead><tr>
      <th data-k="0">Group</th>
      <th class="n" data-k="1">Hours</th>
      <th class="n" data-k="2">Decimal</th>
      <th class="n" data-k="3">Idle</th>
      <th class="n" data-k="4">Sessions</th>
      <th class="n" data-k="5">Share</th>
      <th class="barcell"></th>
    </tr></thead>
    <tbody></tbody>
    <tfoot></tfoot>
  </table></div>
  <div class="empty" id="pivotEmpty" hidden>Nothing matches these filters.</div>
</div>

<div class="panel">
  <div class="rowline">
    <h2>Sessions <span class="muted" id="detailCount"></span></h2>
    <button class="ghost" id="dlDetail" type="button">Download CSV</button>
  </div>
  <div class="scroll"><table id="detail">
    <thead><tr>
      <th data-k="date">Date</th>
      <th data-k="start">Start</th>
      <th data-k="end">End</th>
      <th data-k="user">User</th>
      <th data-k="job">Job</th>
      <th data-k="task">Task</th>
      <th data-k="dwg">Drawing</th>
      <th class="n" data-k="active">Hours</th>
      <th class="n" data-k="idle">Idle</th>
      <th data-k="status">Status</th>
    </tr></thead>
    <tbody></tbody>
  </table></div>
</div>

<script>
/*__CADHOURS_DATA__*/

(function () {
  "use strict";

  var COLS = CADHOURS.columns;
  var ROWS = CADHOURS.rows.map(function (r) {
    var o = {};
    COLS.forEach(function (c, i) { o[c] = r[i]; });
    o.active = +o.active || 0;
    o.idle   = +o.idle   || 0;
    return o;
  });

  var $ = function (id) { return document.getElementById(id); };

  function hhmm(secs) {
    var m = Math.round(secs / 60), h = Math.floor(m / 60);
    return h + ":" + String(m % 60).padStart(2, "0");
  }
  function dec(secs) { return (secs / 3600).toFixed(2); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---- filter controls ---- */

  function fillSelect(el, values, allLabel) {
    var opts = ['<option value="">' + allLabel + "</option>"];
    values.sort().forEach(function (v) {
      if (v !== "") opts.push('<option value="' + esc(v) + '">' + esc(v) + "</option>");
    });
    el.innerHTML = opts.join("");
  }
  function uniq(key) {
    var seen = Object.create(null);
    ROWS.forEach(function (r) { seen[r[key]] = 1; });
    return Object.keys(seen);
  }

  fillSelect($("fuser"), uniq("user"), "Everyone");
  fillSelect($("fjob"),  uniq("job"),  "All jobs");

  $("meta").textContent =
    CADHOURS.from + " to " + CADHOURS.to +
    "  ·  " + ROWS.length + " sessions  ·  generated " + CADHOURS.generated +
    "  ·  " + CADHOURS.root;

  /* ---- filtering ---- */

  function current() {
    var q = $("q").value.trim().toLowerCase(),
        u = $("fuser").value, j = $("fjob").value,
        f = $("from").value, t = $("to").value;
    return ROWS.filter(function (r) {
      if (u && r.user !== u) return false;
      if (j && r.job !== j) return false;
      if (f && r.date < f) return false;
      if (t && r.date > t) return false;
      if (q) {
        var hay = (r.user + " " + r.job + " " + r.task + " " + r.dwg + " " +
                   r.path + " " + r.date + " " + r.notes + " " + r.machine).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  /* ---- pivot ---- */

  var pivotSort = { k: 1, dir: -1 };
  var lastPivot = [], lastRows = [];

  function groupKey(r, spec) {
    return spec.split("|").map(function (k) { return r[k] || "(blank)"; }).join("  ·  ");
  }

  function pivot(rows, spec) {
    var map = Object.create(null);
    rows.forEach(function (r) {
      var k = groupKey(r, spec);
      var e = map[k] || (map[k] = { k: k, active: 0, idle: 0, n: 0 });
      e.active += r.active; e.idle += r.idle; e.n += 1;
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  function renderPivot(rows) {
    var spec = $("grp").value;
    var data = pivot(rows, spec);
    var total = data.reduce(function (a, e) { return a + e.active; }, 0);
    var maxv  = data.reduce(function (a, e) { return Math.max(a, e.active); }, 0) || 1;

    var cell = [function (e) { return e.k; },
                function (e) { return e.active; },
                function (e) { return e.active; },
                function (e) { return e.idle; },
                function (e) { return e.n; },
                function (e) { return e.active; }][pivotSort.k];
    data.sort(function (a, b) {
      var x = cell(a), y = cell(b);
      if (x === y) return a.k < b.k ? -1 : 1;
      return (x > y ? 1 : -1) * pivotSort.dir;
    });

    lastPivot = data;
    $("pivotTitle").textContent = "Hours by " +
      $("grp").options[$("grp").selectedIndex].text.toLowerCase();
    $("pivotEmpty").hidden = data.length > 0;

    $("pivot").tBodies[0].innerHTML = data.map(function (e) {
      var pct = total ? (100 * e.active / total) : 0;
      return "<tr><td>" + esc(e.k) + "</td>" +
             '<td class="n">' + hhmm(e.active) + "</td>" +
             '<td class="n">' + dec(e.active) + "</td>" +
             '<td class="n muted">' + hhmm(e.idle) + "</td>" +
             '<td class="n">' + e.n + "</td>" +
             '<td class="n">' + pct.toFixed(1) + "%</td>" +
             '<td class="barcell"><span class="bar" style="width:' +
                (100 * e.active / maxv).toFixed(1) + '%"></span></td></tr>';
    }).join("");

    $("pivot").tFoot.innerHTML =
      "<tr><td>TOTAL</td>" +
      '<td class="n">' + hhmm(total) + "</td>" +
      '<td class="n">' + dec(total) + "</td>" +
      '<td class="n">' + hhmm(data.reduce(function (a, e) { return a + e.idle; }, 0)) + "</td>" +
      '<td class="n">' + data.reduce(function (a, e) { return a + e.n; }, 0) + "</td>" +
      '<td class="n">100%</td><td></td></tr>';
  }

  /* ---- summary cards ---- */

  function renderCards(rows) {
    var total = rows.reduce(function (a, r) { return a + r.active; }, 0);
    var idle  = rows.reduce(function (a, r) { return a + r.idle; }, 0);
    var days  = uniqCount(rows, "date"), running = rows.filter(function (r) {
      return r.status === "RUNNING";
    }).length;
    var cards = [
      ["Billed hours", hhmm(total) + " <span class='muted' style='font-size:13px'>(" + dec(total) + ")</span>"],
      ["Sessions", rows.length + (running ? " <span class='pill run'>" + running + " running</span>" : "")],
      ["People", uniqCount(rows, "user")],
      ["Jobs", uniqCount(rows, "job")],
      ["Drawings", uniqCount(rows, "dwg")],
      ["Days worked", days],
      ["Avg per day", days ? hhmm(total / days) : "0:00"],
      ["Idle discarded", hhmm(idle)]
    ];
    $("cards").innerHTML = cards.map(function (c) {
      return '<div class="card"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + "</div></div>";
    }).join("");
  }
  function uniqCount(rows, key) {
    var s = Object.create(null);
    rows.forEach(function (r) { if (r[key] !== "") s[r[key]] = 1; });
    return Object.keys(s).length;
  }

  /* ---- detail table ---- */

  var detSort = { k: "date", dir: -1 };

  function renderDetail(rows) {
    var data = rows.slice().sort(function (a, b) {
      var x = a[detSort.k], y = b[detSort.k];
      if (x === y) return 0;
      return (x > y ? 1 : -1) * detSort.dir;
    });
    lastRows = data;
    $("detailCount").textContent = "(" + data.length + ")";
    $("detail").tBodies[0].innerHTML = data.map(function (r) {
      return "<tr><td>" + esc(r.date) + "</td>" +
             "<td>" + esc(r.start.slice(11, 16)) + "</td>" +
             "<td>" + esc(r.end.slice(11, 16)) + "</td>" +
             "<td>" + esc(r.user) + "</td>" +
             "<td>" + esc(r.job) + "</td>" +
             "<td>" + esc(r.task) + "</td>" +
             '<td title="' + esc(r.path) + '">' + esc(r.dwg) + "</td>" +
             '<td class="n">' + hhmm(r.active) + "</td>" +
             '<td class="n muted">' + hhmm(r.idle) + "</td>" +
             "<td>" + (r.status === "RUNNING"
                        ? '<span class="pill run">running</span>'
                        : '<span class="pill">' + esc(r.status.toLowerCase()) + "</span>") +
             "</td></tr>";
    }).join("");
  }

  /* ---- CSV download ---- */

  function download(name, text) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  function csv(rowsOfArrays) {
    return rowsOfArrays.map(function (r) {
      return r.map(function (v) {
        return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      }).join(",");
    }).join("\r\n");
  }

  $("dlPivot").addEventListener("click", function () {
    download("cadhours-summary.csv", csv(
      [[$("grp").value, "hours_hhmm", "hours_decimal", "idle_hhmm", "sessions"]].concat(
        lastPivot.map(function (e) { return [e.k, hhmm(e.active), dec(e.active), hhmm(e.idle), e.n]; }))));
  });
  $("dlDetail").addEventListener("click", function () {
    download("cadhours-sessions.csv", csv(
      [COLS].concat(lastRows.map(function (r) {
        return COLS.map(function (c) { return r[c]; });
      }))));
  });

  /* ---- wiring ---- */

  function draw() {
    var rows = current();
    renderCards(rows);
    renderPivot(rows);
    renderDetail(rows);
  }

  ["q", "fuser", "fjob", "from", "to", "grp"].forEach(function (id) {
    $(id).addEventListener(id === "q" ? "input" : "change", draw);
  });
  $("reset").addEventListener("click", function () {
    ["q", "fuser", "fjob", "from", "to"].forEach(function (id) { $(id).value = ""; });
    draw();
  });

  Array.prototype.forEach.call($("pivot").tHead.rows[0].cells, function (th, i) {
    if (!th.dataset.k) return;
    th.addEventListener("click", function () {
      var k = +th.dataset.k;
      pivotSort = { k: k, dir: pivotSort.k === k ? -pivotSort.dir : (k === 0 ? 1 : -1) };
      draw();
    });
  });
  Array.prototype.forEach.call($("detail").tHead.rows[0].cells, function (th) {
    th.addEventListener("click", function () {
      var k = th.dataset.k;
      detSort = { k: k, dir: detSort.k === k ? -detSort.dir : 1 };
      draw();
    });
  });

  draw();
})();
</script>
</body>
</html>
